# RNF02: nunca hardcodear credenciales; siempre por variable de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pr01_inventario}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema ya existe (sql/schema.sql de Web 1.0/2.0); Spring Data JPA solo lo mapea, no lo genera.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${API_PORT:8081}
